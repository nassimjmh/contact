<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des contacts</title>

</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" href="/">Accueil</a>
        <a th:href="@{/contacts}" href="/contacts">Liste des contacts</a>
        <a th:href="@{/ajout}" href="/ajout">Ajouter un contact</a>
        <a th:href="@{/delete}" href="/delete">Supprimer un contact</a>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Liste des contacts</h1>
            <a th:href="@{/ajout}" href="/ajout" class="btn">+ Ajouter un contact</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Note</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${contacts == null or #lists.isEmpty(contacts)}">
                    <td colspan="5" class="empty-message">Aucun contact enregistré pour le moment.</td>
                </tr>
                <tr th:each="contact : ${contacts}">
                    <td th:text="${contact.id}">1</td>
                    <td th:text="${contact.nom}">Nom</td>
                    <td th:text="${contact.email}">email@example.com</td>
                    <td th:text="${contact.note}">10</td>
                    <td>
                        <form th:action="@{/deleteSave}" action="/deleteSave" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${contact.id}" />
                            <button type="submit" class="btn-delete" onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce contact ?');">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
