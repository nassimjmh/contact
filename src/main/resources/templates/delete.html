<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer un contact</title>

</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" href="/">Accueil</a>
        <a th:href="@{/contacts}" href="/contacts">Liste des contacts</a>
        <a th:href="@{/ajout}" href="/ajout">Ajouter un contact</a>
        <a th:href="@{/delete}" href="/delete">Supprimer un contact</a>
    </nav>

    <div class="container">
        <h1>Supprimer un contact</h1>
        <div class="info-message">
            Saisissez l'ID du contact à supprimer, ou consultez la <a th:href="@{/contacts}" href="/contacts">liste des contacts</a> pour supprimer directement depuis le tableau.
        </div>
        <form th:action="@{/deleteSave}" action="/deleteSave" method="post">
            <div class="form-group">
                <label for="id">Identifiant (ID) du contact :</label>
                <input type="number" id="id" name="id" placeholder="Entrez l'ID du contact" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-delete" onclick="return confirm('Confirmer la suppression de ce contact ?');">Supprimer</button>
                <a th:href="@{/contacts}" href="/contacts" class="btn-cancel">Retour à la liste</a>
            </div>
        </form>
    </div>
</body>
</html>
