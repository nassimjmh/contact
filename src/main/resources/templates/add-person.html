<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une personne</title>
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" href="/">Accueil</a> |
        <a th:href="@{/contacts}" href="/contacts">Liste des contacts</a> |
        <a th:href="@{/contacts/recherche}" href="/contacts/recherche">Rechercher contacts</a> |
        <a th:href="@{/contacts/proprietaire}" href="/contacts/proprietaire">Trouver propriétaire</a> |
        <a th:href="@{/personnes}" href="/personnes">Liste des personnes</a> |
        <a th:href="@{/personnes/sans-contact}" href="/personnes/sans-contact">Personnes sans contact</a> |
        <a th:href="@{/personnes/meilleure-moyenne}" href="/personnes/meilleure-moyenne">Meilleure moyenne</a>
    </nav>

    <div class="container">
        <h1>Ajouter une personne</h1>

        <form th:action="@{/personnes/save}" action="/personnes/save" method="post">
            <div class="form-group">
                <label for="nom">Nom :</label><br>
                <input type="text" id="nom" name="nom" placeholder="Entrez le nom" required>
            </div>
            <br>
            <div class="form-group">
                <label for="prenom">Prénom :</label><br>
                <input type="text" id="prenom" name="prenom" placeholder="Entrez le prénom" required>
            </div>
            <br>
            <div class="form-group">
                <label for="adresse">Adresse :</label><br>
                <input type="text" id="adresse" name="adresse" placeholder="Entrez l'adresse" required>
            </div>
            <br>
            <div class="form-actions">
                <button type="submit" class="btn-submit">Enregistrer</button>
                <a th:href="@{/personnes}" href="/personnes" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
